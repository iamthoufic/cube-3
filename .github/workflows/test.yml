name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Solver tests
        run: |
          if [ -f tests/solver.test.mjs ] \
             && [ -f js/solver/optimal.js ] \
             && [ -f js/solver/core.js ] \
             && [ $(wc -c < js/solver/core.js) -gt 10000 ]; then
            echo "Full solver source detected — running tests"
            npm test
          else
            echo "Solver source incomplete — skipping tests."
            echo "Required: js/solver/core.js (>10KB), js/solver/optimal.js, tests/solver.test.mjs"
            echo "Push the remaining files from cube3-solver.zip to enable full CI."
            exit 0
          fi

      - name: Single-file build
        continue-on-error: true
        run: |
          if [ -f scripts/build.mjs ] && [ -f index.html ] && [ -f css/style.css ]; then
            npm run build
          else
            echo "Build assets incomplete — skipping."
            exit 0
          fi
